<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPI Logística IF — Live</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--g:#135845;--gm:#1a9168;--bg:#f0f9f5;--bdr:#b2d8c8;--td:#0d2b1f;--ts:#6b9e8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f4f9f6;color:var(--td)}
.hdr{background:linear-gradient(135deg,#061a12,#0d3328);border-bottom:3px solid var(--g);height:56px;padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
.hdr-t{font-size:11pt;font-weight:700;color:#fff;flex:1}
.hdr-sub{font-size:8pt;color:#6ee7b7;margin-top:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.refresh-btn{padding:5px 12px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;font-size:8pt;cursor:pointer;font-family:inherit}
.refresh-btn:hover{background:rgba(255,255,255,.2)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px}
.spinner{width:40px;height:40px;border:3px solid var(--bdr);border-top-color:var(--g);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-size:9pt;color:var(--ts)}
.load-step{font-size:8pt;color:var(--ts);font-style:italic}
.main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
/* Tabs */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--bdr);overflow-x:auto;position:sticky;top:56px;z-index:100}
.tab{padding:10px 16px;font-size:8.5pt;font-weight:600;color:var(--ts);cursor:pointer;border-right:1px solid var(--bdr);white-space:nowrap;user-select:none;transition:all .15s;flex-shrink:0}
.tab:hover{background:var(--bg);color:var(--g)}
.tab.active{background:var(--g);color:#fff}
.tab-panel{display:none}.tab-panel.active{display:block}
/* Cards KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi-card{background:#fff;border:1.5px solid var(--bdr);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-card.verde::before{background:#059669}.kpi-card.rojo::before{background:#dc2626}
.kpi-card.amarillo::before{background:#d97706}.kpi-card.azul::before{background:#2563eb}
.kpi-card.gris::before{background:#9ca3af}
.kpi-lbl{font-size:7.5pt;font-weight:600;color:var(--ts);margin-bottom:4px;line-height:1.3}
.kpi-val{font-family:'DM Mono',monospace;font-size:24pt;font-weight:500;line-height:1;color:var(--td)}
.kpi-val.verde{color:#059669}.kpi-val.rojo{color:#dc2626}.kpi-val.amarillo{color:#d97706}.kpi-val.azul{color:#2563eb}
.kpi-sub{font-size:7pt;color:#9ca3af;margin-top:3px}
.kpi-trend{font-size:7.5pt;font-weight:700;margin-top:4px}
.kpi-trend.up{color:#059669}.kpi-trend.dn{color:#dc2626}.kpi-trend.eq{color:#9ca3af}
/* Sección */
.sec{background:#fff;border:1.5px solid var(--bdr);border-radius:10px;margin-bottom:12px;overflow:hidden}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none}
.sec-hdr:hover{background:#fafffe}
.si{font-size:13pt;flex-shrink:0}.st{font-size:9.5pt;font-weight:700;color:var(--td);flex:1}
.caret{font-size:8pt;color:var(--ts);transition:transform .18s}
.caret.open{transform:rotate(180deg)}
.sec-body{display:none;padding:4px 14px 14px;border-top:1px solid var(--bdr)}
.sec-body.open{display:block}
.bdg{display:inline-block;padding:2px 9px;border-radius:10px;font-size:7.5pt;font-weight:700;flex-shrink:0}
.bdg.red{background:#fee2e2;color:#7f1d1d}.bdg.ok{background:#d1fae5;color:#065f46}
.bdg.amb{background:#fef3c7;color:#78350f}.bdg.blu{background:#dbeafe;color:#1e3a8a}.bdg.neu{background:#f3f4f6;color:#6b7280}
/* Tabla */
.tbl-wrap{overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:7.5pt}
.dt thead tr{background:var(--tc,var(--g))}
.dt th{color:#fff;padding:5px 8px;font-weight:600;white-space:nowrap;text-align:left}
.dt tbody tr:nth-child(even){background:#f8fdf9}
.dt td{padding:4px 8px;border-bottom:.4px solid var(--bdr);white-space:nowrap}
.empty{color:var(--ts);font-size:8.5pt;padding:12px 0;font-style:italic;text-align:center}
/* Gráficos de barra simple */
.bar-chart{margin:10px 0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bar-lbl{font-size:7.5pt;color:var(--ts);min-width:120px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:14px;background:#f3f4f6;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bar-num{font-size:7.5pt;font-family:'DM Mono',monospace;font-weight:600;min-width:50px;color:var(--td)}
/* Mini sparkline */
.sparkline-wrap{margin:8px 0 4px}
.sparkline-lbl{font-size:7.5pt;color:var(--ts);margin-bottom:4px}
/* Grilla semana vs semana */
.sem-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.sem-card{background:#fff;border:1.5px solid var(--bdr);border-radius:10px;padding:14px}
.sem-title{font-size:8pt;font-weight:700;color:var(--ts);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bdr)}
/* Nota */
.nota{background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:7px 12px;font-size:8.5pt;color:#78350f;margin:8px 0;line-height:1.5}
.nota.blu{background:#eff6ff;border-color:#93c5fd;color:#1e3a8a}
.nota.ok{background:#ecfdf5;border-color:#10b981;color:#065f46}
.nota.red{background:#fef2f2;border-color:#fca5a5;color:#7f1d1d}
/* Det t */
.det-t{font-size:8.5pt;font-weight:700;color:var(--g);margin:10px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--bdr)}
/* Semana selector */
.sem-sel{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sem-sel select{padding:5px 10px;border:1.5px solid var(--bdr);border-radius:6px;font-size:8.5pt;font-family:inherit;background:#fff}
.sem-sel label{font-size:8pt;font-weight:700;color:var(--g)}
/* Estado badge en tabla */
.est-rem{background:#d1fae5;color:#065f46;padding:1px 6px;border-radius:4px;font-size:7pt;font-weight:700}
.est-ord{background:#dbeafe;color:#1e3a8a;padding:1px 6px;border-radius:4px;font-size:7pt;font-weight:700}
.est-pedir{background:#fee2e2;color:#7f1d1d;padding:1px 6px;border-radius:4px;font-size:7pt;font-weight:700}
.est-sinr{background:#fef3c7;color:#78350f;padding:1px 6px;border-radius:4px;font-size:7pt;font-weight:700}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.sem-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div class="live-dot"></div>
  <div>
    <div class="hdr-t">KPI Logística IF — Live</div>

  </div>

<script>
// ══ CONFIG ════════════════════════════════════════════════════════════════════
var FORM_ID  = '1Oj8HKHs-BubsDM2odoHlMQWD1TJJbDlZlosi1vooXcc';
var CUPOS_ID = '1yZhY0Ljbn6LrewtAFy-WANXFKHP_mjHcHV8Ew3TlzGg';
var CUPOS_SHEET = 'CUPOS';

// ══ UTILS ════════════════════════════════════════════════════════════════════
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  var tabEl=document.querySelector('.tab[data-tab="'+name+'"]');
  var panelEl=document.getElementById('tab-'+name);
  if(tabEl)tabEl.classList.add('active');
  if(panelEl)panelEl.classList.add('active');
}
function tog(id){
  var b=document.getElementById(id+'-body'),c=document.getElementById(id+'-c');
  if(b)b.classList.toggle('open');if(c)c.classList.toggle('open');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fN(v,d){if(v===null||v===undefined)return '—';var f=parseFloat(v);return isNaN(f)?String(v):(d!=null?f.toFixed(d):Math.round(f).toLocaleString('es-AR'));}
function fmtD(d){if(!d)return '';return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function parseD(s){
  if(!s)return null;
  s=String(s).trim().split(' ')[0];
  var p=s.split('/');
  if(p.length===3){
    // dd/mm/yyyy
    if(parseInt(p[2])>1000) return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  }
  var d=new Date(s);return isNaN(d)?null:d;
}
function semISO(d){
  var date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  date.setUTCDate(date.getUTCDate()+4-(date.getUTCDay()||7));
  var yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  var wk=Math.ceil((((date-yearStart)/86400000)+1)/7);
  return date.getUTCFullYear()+'-W'+(wk<10?'0':'')+wk;
}
function trend(now,prev){
  if(!prev||prev===0)return '<span class="kpi-trend eq">—</span>';
  var pct=Math.round((now-prev)/prev*100);
  var arrow=pct>0?'↑':pct<0?'↓':'→';
  var cls=pct>0?'up':pct<0?'dn':'eq';
  // Para alertas (sin pedido, reclamos): rojo si sube
  return '<span class="kpi-trend '+cls+'">'+arrow+' '+Math.abs(pct)+'%</span>';
}
function tH(cols,rows,color){
  color=color||'#135845';
  if(!rows||!rows.length)return '<p class="empty">Sin registros</p>';
  var h='<div class="tbl-wrap"><table class="dt" style="--tc:'+color+'"><thead><tr>'+
    cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  var lim=Math.min(rows.length,80);
  rows.slice(0,lim).forEach(function(r){
    h+='<tr>'+r.map(function(v){
      var s=String(v==null?'—':v);
      if(s.startsWith('HTML:'))return '<td>'+s.slice(5)+'</td>';
      return '<td>'+esc(s.slice(0,60))+'</td>';
    }).join('')+'</tr>';
  });
  if(rows.length>lim)h+='<tr><td colspan="'+cols.length+'" style="text-align:center;color:#9ca3af;font-style:italic">... y '+(rows.length-lim)+' más</td></tr>';
  return h+'</tbody></table></div>';
}
function barChart(data,color,maxVal){
  if(!data||!data.length)return '<p class="empty">Sin datos</p>';
  color=color||'#135845';
  maxVal=maxVal||Math.max.apply(null,data.map(function(d){return d[1]||0;}))||1;
  var h='<div class="bar-chart">';
  data.forEach(function(d){
    var pct=Math.min((d[1]||0)/maxVal*100,100);
    h+='<div class="bar-row"><div class="bar-lbl" title="'+esc(d[0])+'">'+esc(String(d[0]).slice(0,18))+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '<div class="bar-num">'+fN(d[1],d[2]||0)+(d[3]||'')+'</div></div>';
  });
  return h+'</div>';
}
function miniSpark(vals, color){
  if(!vals||vals.length<2)return '';
  var max=Math.max.apply(null,vals)||1;
  var min=Math.min.apply(null,vals.filter(function(v){return v>0;}))||0;
  var w=200,h=36,n=vals.length;
  var pts=vals.map(function(v,i){
    var x=Math.round(i/(n-1)*(w-4))+2;
    var y=Math.round(h-2-((v-min)/(max-min||1))*(h-4))+2;
    return x+','+y;
  }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts+'" fill="none" stroke="'+(color||'#135845')+'" stroke-width="2" stroke-linejoin="round"/></svg>';
}

// ══ FETCH CSV DESDE GOOGLE SHEETS ════════════════════════════════════════════
function fetchSheet(url){
  return fetch(url).then(function(r){
    if(!r.ok)throw new Error('Error '+r.status+' al leer '+fileId);
    return r.text();
  }).then(function(text){
    return parseCSV(text);
  });
}
function parseCSV(text){
  var rows=[],i=0,n=text.length;
  while(i<n){
    var row=[],inQ=false,cell='';
    while(i<n){
      var c=text[i++];
      if(c==='"'){if(inQ&&text[i]==='"'){cell+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cell.trim());cell='';}
      else if((c==='\n'||c==='\r')&&!inQ){
        if(c==='\r'&&text[i]==='\n')i++;
        row.push(cell.trim());break;
      }
      else cell+=c;
    }
    if(row.some(function(c){return c!=='';}))rows.push(row);
  }
  return rows;
}

// ══ PARSEAR FORM ════════════════════════════════════════════════════════════
function parseForm(rows){
  if(!rows||rows.length<2)return[];
  var hdrs=rows[0];
  function gi(name){return hdrs.findIndex(function(h){return h.toUpperCase().includes(name.toUpperCase());});}
  var iNumPed=0, iFecha=1, iEmail=2, iRS=3, iAccion=7, iFerti=10, iCant=13;
  return rows.slice(1).map(function(r){
    return {
      numPed: (r[iNumPed]||'').trim(),
      fecha:  parseD(r[iFecha]||''),
      email:  (r[iEmail]||'').trim().toLowerCase(),
      comercial: (r[iEmail]||'').split('@')[0].trim().toLowerCase(),
      rs:     (r[iRS]||'').trim(),
      accion: (r[iAccion]||'').trim().toUpperCase(),
      fertil: (r[iFerti]||'').trim(),
      cantStr:(r[iCant]||'').trim(),
      cant:   parseTn(r[iCant]||'')
    };
  }).filter(function(r){return r.fecha;});
}

function parseTn(s){
  s=String(s).replace(/[tnTNltsLTS]/g,'').replace(',','.').replace(/\s/g,'');
  var v=parseFloat(s);
  return (!isNaN(v)&&v>0&&v<100000)?v:0;
}

// ══ PARSEAR CUPOS ═══════════════════════════════════════════════════════════
function parseCupos(rows){
  if(!rows||rows.length<2)return[];
  var hdrs=rows[0].map(function(h){return h.toUpperCase().trim();});
  function gi(name){return hdrs.findIndex(function(h){return h.includes(name.toUpperCase());});}
  var iFecha=gi('FECHA DE CUPO'),iEstado=gi('ESTADO DEL CUPO'),iCliente=gi('IF CLIENTE'),
      iProveedor=gi('IF PROVEEDOR'),iFertil=gi('FERTILIZANTES'),iCant=gi('CANTIDAD'),
      iRemito=gi('REMITO'),iDeposito=gi('DEPOSITO'),iDestino=gi('DESTINO'),
      iVenta=gi('IF VENTA'),iNum=gi('NUM DE CUPO'),iLogIF=gi('LOGISTICA IF'),iPres=gi('PRESENTACION');
  var LIQS_K=['solucion','litros','urkem','urea liquida','urea automotor','uan'];
  function esLiq(f,p){
    var fl=(f||'').toLowerCase(),pl=(p||'').toLowerCase();
    if(LIQS_K.some(function(k){return fl.includes(k);}))return true;
    if(['ibc','bidon','liquido','tambor'].some(function(k){return pl.includes(k);}))return true;
    return false;
  }
  return rows.slice(1).map(function(r){
    var estado=(r[iEstado]||'').trim().toUpperCase();
    var fertil=(r[iFertil]||'').trim(),pres=(r[iPres]||'').trim();
    var cant=parseTn(r[iCant]||'');
    var liq=esLiq(fertil,pres);
    return {
      fecha:    parseD(r[iFecha]||''),
      fechaStr: (r[iFecha]||'').trim(),
      estado:   estado,
      cliente:  (r[iCliente]||'').trim(),
      proveedor:(r[iProveedor]||'').trim(),
      fertil:   fertil, pres: pres,
      cant:     cant, cantStr:(r[iCant]||'').trim(),
      esLiq:    liq, tnSol:liq?0:cant, ltsLiq:liq?cant:0,
      remito:   (r[iRemito]||'').trim(),
      deposito: (r[iDeposito]||'').trim(),
      destino:  (r[iDestino]||'').trim(),
      venta:    (r[iVenta]||'').trim(),
      numCupo:  (r[iNum]||'').trim(),
      logIF:    (r[iLogIF]||'').trim()
    };
  }).filter(function(r){return r.fecha&&r.estado;});
}

// ══ CALCULAR KPIs ═════════════════════════════════════════════════════════
function calcKPIs(frm, cup){
  var hoy=new Date();
  hoy.setHours(23,59,59);
  var semActual=semISO(hoy);
  var semAnt=semISO(new Date(hoy-7*864e5));

  // Por semana
  var bySem={};
  frm.forEach(function(r){
    if(!r.fecha)return;
    var sem=semISO(r.fecha);
    if(!bySem[sem])bySem[sem]={cierres:0,sinPed:0,cuposSol:0,envioCarga:0,reclamos:0,tn:0,comerciales:{},fertilizantes:{}};
    var d=bySem[sem];
    if(r.accion.includes('CIERRE')){
      d.cierres++;
      if(!r.numPed)d.sinPed++;
      if(r.cant>0)d.tn+=r.cant;
      d.comerciales[r.comercial]=(d.comerciales[r.comercial]||0)+1;
      if(r.fertil)d.fertilizantes[r.fertil]=(d.fertilizantes[r.fertil]||0)+(r.cant||1);
    }
    if(r.accion.includes('SOLICITAR')&&r.accion.includes('CUPO'))d.cuposSol++;
    if(r.accion.includes('ENVIAR DATOS'))d.envioCarga++;
    if(r.accion.includes('RECLAMO'))d.reclamos++;
  });

  // Cupos por estado
  var cupEstados={pedir:[],sinResp:[],ordenEnv:[],remitidos:[]};
  var hoyStr=hoy.toDateString();
  cup.forEach(function(r){
    if(r.estado.includes('PEDIR CUPO'))cupEstados.pedir.push(r);
    else if(r.estado.includes('SIN RESPUESTA')||r.estado.includes('PENDIENTE DE RESPUESTA'))cupEstados.sinResp.push(r);
    else if(r.estado.includes('ORDEN ENVIADA')){
      // Excluir los de hoy — están en proceso de carga
      if(!r.fecha||r.fecha.toDateString()!==hoyStr)cupEstados.ordenEnv.push(r);
    }
    else if(r.estado.includes('REMITIDO'))cupEstados.remitidos.push(r);
  });

  // TN/Lts remitidas últimas 4 semanas (separado sólidos/líquidos)
  var tnRem4sem=0,ltsRem4sem=0,nRem4sem=0;
  cup.forEach(function(r){
    if(!r.fecha)return;
    var dias=(hoy-r.fecha)/864e5;
    if(r.estado.includes('REMITIDO')&&dias<=28){
      tnRem4sem+=r.tnSol;ltsRem4sem+=r.ltsLiq;nRem4sem++;
    }
  });

  // Semanas disponibles (últimas 12)
  var semanas=Object.keys(bySem).sort().slice(-12);

  return {bySem:bySem,semanas:semanas,semActual:semActual,semAnt:semAnt,
          cupEstados:cupEstados,tnRem4sem:tnRem4sem,ltsRem4sem:ltsRem4sem,nRem4sem:nRem4sem,hoy:hoy};
}

// ══ RENDER RESUMEN ═══════════════════════════════════════════════════════════
function renderResumen(frm,cup,kpi){
  var sa=kpi.bySem[kpi.semActual]||{cierres:0,sinPed:0,cuposSol:0,envioCarga:0,reclamos:0,tn:0};
  var sp=kpi.bySem[kpi.semAnt]||{cierres:0,sinPed:0,cuposSol:0,envioCarga:0,reclamos:0,tn:0};

  function card(lbl,val,prev,cls,sub){
    var tr=trend(val,prev);
    return '<div class="kpi-card '+cls+'"><div class="kpi-lbl">'+lbl+'</div>'+
      '<div class="kpi-val '+cls+'">'+fN(val)+'</div>'+
      '<div class="kpi-sub">'+sub+'</div>'+tr+'</div>';
  }

  var h='';
  h+='<div class="nota blu" style="margin-bottom:14px">📅 Semana actual: <strong>'+kpi.semActual+'</strong> — Semana anterior: <strong>'+kpi.semAnt+'</strong></div>';

  h+='<div class="det-t">📊 Esta semana vs semana anterior</div>';
  h+='<div class="kpi-grid">';
  h+=card('Cierres de negocio',sa.cierres,sp.cierres,'azul','sem actual');
  h+=card('TN cerradas',sa.tn,sp.tn,'verde',sa.tn>0?fN(sa.tn,1)+' tn':'');
  h+=card('Cupos solicitados',sa.cuposSol,sp.cuposSol,'azul','sem actual');
  h+=card('Datos de carga enviados',sa.envioCarga,sp.envioCarga,'gris','sem actual');
  h+=card('Sin N° de pedido',sa.sinPed,sp.sinPed,sa.sinPed>0?'rojo':'verde','cierres');
  h+=card('Reclamos',sa.reclamos,sp.reclamos,sa.reclamos>0?'rojo':'verde','sem actual');
  h+='</div>';

  h+='<div class="det-t" style="margin-top:4px">📦 Estado de cupos (tiempo real)</div>';
  h+='<div class="kpi-grid">';
  var pe=kpi.cupEstados.pedir.length, sr=kpi.cupEstados.sinResp.length;
  var oe=kpi.cupEstados.ordenEnv.length;
  h+=card('Pendientes de pedir',pe,null,pe>0?'rojo':'verde','cupos abiertos');
  h+=card('Sin respuesta',sr,null,sr>0?'amarillo':'verde','esperando confirmación');
  h+=card('Orden enviada (días ant.)',oe,null,oe>0?'rojo':'verde','pendiente de remito');
  h+=card('Remitidos (4 semanas)',kpi.nRem4sem,null,'verde',fN(kpi.tnRem4sem,1)+' tn · '+fN(kpi.ltsRem4sem/1000,0)+'k lts');
  h+='</div>';

  // Alerta si hay órdenes enviadas sin remito
  if(oe>0){
    var cup=window._cup||[];
    var sinRemito=cup.filter(function(r){return r.estado.includes('ORDEN ENVIADA')&&!r.remito;});
    var conRemito=cup.filter(function(r){return r.estado.includes('ORDEN ENVIADA')&&r.remito;});
    h+='<div class="nota red" style="margin-bottom:14px">⚠️ <strong>'+oe+' cupo(s) de días anteriores con Orden Enviada sin remito</strong>';
    if(sinRemito.length) h+=' — <strong>'+sinRemito.length+' sin N° remito</strong>';
    if(conRemito.length) h+=' — <strong>'+conRemito.length+' con remito pero sin cargar en sistema</strong>';
    h+=' → Ver pestaña 📦 Cupos</div>';
  }

  // Mini sparkline cierres últimas 8 semanas
  var sems8=kpi.semanas.slice(-8);
  var valsCierres=sems8.map(function(s){return (kpi.bySem[s]||{cierres:0}).cierres;});
  var valsTn=sems8.map(function(s){return (kpi.bySem[s]||{tn:0}).tn;});
  h+='<div class="sem-grid">';
  h+='<div class="sec" style="padding:12px 14px"><div class="det-t" style="margin-top:0">Evolución cierres (8 semanas)</div>';
  h+=barChart(sems8.map(function(s,i){return [s.replace('2026-',''),valsCierres[i]];}), '#2563eb');
  h+='</div>';
  h+='<div class="sec" style="padding:12px 14px"><div class="det-t" style="margin-top:0">Evolución TN cerradas (8 semanas)</div>';
  h+=barChart(sems8.map(function(s,i){return [s.replace('2026-',''),valsTn[i],1,' tn'];}), '#059669');
  h+='</div>';
  h+='</div>';

  document.getElementById('resumen-content').innerHTML=h;
}

// ══ RENDER NEGOCIOS ══════════════════════════════════════════════════════════
function renderNegocios(frm,cup,kpi){
  var h='';
  // Selector de semana
  var sems=kpi.semanas.slice().reverse();
  h+='<div class="sem-sel"><label>Semana:</label>';
  h+='<select id="neg-sem-sel" onchange="filtrarNegocios()">';
  sems.forEach(function(s){
    h+='<option value="'+s+'"'+(s===kpi.semActual?' selected':'')+'>'+s+'</option>';
  });
  h+='</select></div>';
  h+='<div id="neg-detail"></div>';
  document.getElementById('negocios-content').innerHTML=h;
  filtrarNegocios();
}
function filtrarNegocios(){
  var sel=document.getElementById('neg-sem-sel');
  if(!sel)return;
  var sem=sel.value;
  var frm=window._frm||[];
  var cierres=frm.filter(function(r){return r.accion.includes('CIERRE')&&semISO(r.fecha)===sem;});
  var sinPed=cierres.filter(function(r){return !r.numPed;});
  var cupos=frm.filter(function(r){return r.accion.includes('SOLICITAR')&&r.accion.includes('CUPO')&&semISO(r.fecha)===sem;});
  var envios=frm.filter(function(r){return r.accion.includes('ENVIAR DATOS')&&semISO(r.fecha)===sem;});

  var h='';
  // Cards resumen semana
  h+='<div class="kpi-grid">';
  h+='<div class="kpi-card azul"><div class="kpi-lbl">Cierres de negocio</div><div class="kpi-val azul">'+cierres.length+'</div><div class="kpi-sub">'+fN(cierres.reduce(function(s,r){return s+r.cant;},0),1)+' tn</div></div>';
  h+='<div class="kpi-card '+(sinPed.length>0?'rojo':'verde')+'"><div class="kpi-lbl">Sin N° de pedido</div><div class="kpi-val '+(sinPed.length>0?'rojo':'verde')+'">'+sinPed.length+'</div><div class="kpi-sub">deben cargarse</div></div>';
  h+='<div class="kpi-card azul"><div class="kpi-lbl">Cupos solicitados</div><div class="kpi-val azul">'+cupos.length+'</div><div class="kpi-sub"></div></div>';
  h+='<div class="kpi-card gris"><div class="kpi-lbl">Datos de carga</div><div class="kpi-val gris">'+envios.length+'</div><div class="kpi-sub">enviados</div></div>';
  h+='</div>';

  // Tabla cierres
  h+='<div class="sec" id="s-cierres"><div class="sec-hdr" onclick="tog(\'s-cierres\')"><span class="si">🤝</span><span class="st">Cierres de negocio</span><span class="bdg '+(cierres.length>0?'blu':'neu')+'">'+cierres.length+'</span><span class="caret open" id="s-cierres-c">▼</span></div><div class="sec-body open" id="s-cierres-body">';
  if(sinPed.length){
    h+='<div class="nota red">⚠️ '+sinPed.length+' cierre(s) sin número de pedido cargado</div>';
  }
  var rowsCierres=cierres.map(function(r){
    var sinP=!r.numPed?'HTML:<span style="color:#dc2626;font-weight:700">Sin N°</span>':r.numPed;
    return [fmtD(r.fecha),sinP,r.rs.slice(0,30),r.fertil.slice(0,28),fN(r.cant,1)+' tn',r.comercial.slice(0,18)];
  });
  h+=tH(['Fecha','N° Pedido','Razón Social','Fertilizante','Cantidad','Comercial'],rowsCierres,'#2563eb');
  h+='</div></div>';

  // Tabla sin pedido
  if(sinPed.length){
    h+='<div class="sec" id="s-sinped"><div class="sec-hdr" onclick="tog(\'s-sinped\')"><span class="si">⚠️</span><span class="st">Pendientes de cargar en sistema</span><span class="bdg red">'+sinPed.length+'</span><span class="caret open" id="s-sinped-c">▼</span></div><div class="sec-body open" id="s-sinped-body">';
    var rowsSinP=sinPed.map(function(r){return [fmtD(r.fecha),r.rs.slice(0,30),r.fertil.slice(0,28),fN(r.cant,1)+' tn',r.comercial.slice(0,18)];});
    h+=tH(['Fecha','Razón Social','Fertilizante','Cantidad','Comercial'],rowsSinP,'#dc2626');
    h+='</div></div>';
  }

  document.getElementById('neg-detail').innerHTML=h;
}

// ══ RENDER CUPOS ═════════════════════════════════════════════════════════════
function renderCupos(frm,cup,kpi){
  var estados=kpi.cupEstados;
  var h='';

  function secCupos(id,titulo,emoji,rows,cols,color,bdgCls){
    if(!rows.length)return'<div class="sec"><div class="sec-hdr"><span class="si">'+emoji+'</span><span class="st">'+titulo+'</span><span class="bdg ok">0</span></div></div>';
    var rowData=rows.map(cols);
    return '<div class="sec" id="'+id+'"><div class="sec-hdr" onclick="tog(\''+id+'\')"><span class="si">'+emoji+'</span><span class="st">'+titulo+'</span><span class="bdg '+bdgCls+'">'+rows.length+'</span><span class="caret open" id="'+id+'-c">▼</span></div><div class="sec-body open" id="'+id+'-body">'+tH(['Fecha','Cliente','Fertilizante','Cant.','Depósito','N° Cupo'],rowData,color)+'</div></div>';
  }

  var colsCup=function(r){return [r.fechaStr,r.cliente.slice(0,28),r.fertil.slice(0,26),fN(r.cant,1)+' tn',r.deposito,r.numCupo];};
  var colsRem=function(r){return [r.fechaStr,r.cliente.slice(0,28),r.fertil.slice(0,26),fN(r.cant,1)+' tn',r.remito,r.deposito];};

  h+='<div class="kpi-grid" style="margin-bottom:16px">';
  h+='<div class="kpi-card '+(estados.pedir.length>0?'rojo':'verde')+'"><div class="kpi-lbl">Pendientes de pedir cupo</div><div class="kpi-val '+(estados.pedir.length>0?'rojo':'verde')+'">'+estados.pedir.length+'</div></div>';
  h+='<div class="kpi-card '+(estados.sinResp.length>0?'amarillo':'verde')+'"><div class="kpi-lbl">Sin respuesta</div><div class="kpi-val '+(estados.sinResp.length>0?'amarillo':'verde')+'">'+estados.sinResp.length+'</div></div>';
  h+='<div class="kpi-card azul"><div class="kpi-lbl">Orden enviada</div><div class="kpi-val azul">'+estados.ordenEnv.length+'</div></div>';
  h+='<div class="kpi-card verde"><div class="kpi-lbl">Remitidos (total)</div><div class="kpi-val verde">'+estados.remitidos.length+'</div><div class="kpi-sub">'+fN(estados.remitidos.reduce(function(s,r){return s+r.tnSol;},0),1)+' tn · '+fN(estados.remitidos.reduce(function(s,r){return s+r.ltsLiq;},0)/1000,0)+'k lts</div></div>';
  h+='</div>';

  h+=secCupos('s-pedir','Pendientes de pedir cupo','🔴',estados.pedir,colsCup,'#dc2626','red');
  h+=secCupos('s-sinresp','Sin respuesta del proveedor','🟡',estados.sinResp,colsCup,'#d97706','amb');
  // Separar orden enviada: sin remito vs con remito (número cargado pero sin subir al sistema)
  var ordenSinRem = estados.ordenEnv.filter(function(r){return !r.remito;});
  var ordenConRem = estados.ordenEnv.filter(function(r){return !!r.remito;});
  var colsConRem = function(r){return [r.fechaStr,r.cliente.slice(0,28),r.fertil.slice(0,26),fN(r.cant,1)+' tn',r.remito,r.deposito];};
  if(ordenSinRem.length)
    h+=secCupos('s-orden-sin','Sin número de remito aún','🔴',ordenSinRem,colsCup,'#dc2626','red');
  if(ordenConRem.length)
    h+=secCupos('s-orden-con','Con remito — pendiente de cargar en sistema','🟡',ordenConRem,colsConRem,'#d97706','amb');
  if(!estados.ordenEnv.length)
    h+='<div class="sec"><div class="sec-hdr"><span class="si">✅</span><span class="st">Sin órdenes pendientes</span><span class="bdg ok">0</span></div></div>';

  // Remitidos recientes (últimas 4 semanas)
  var hoy=kpi.hoy;
  var remRec=estados.remitidos.filter(function(r){return r.fecha&&(hoy-r.fecha)/864e5<=28;});
  h+='<div class="sec" id="s-remit"><div class="sec-hdr" onclick="tog(\'s-remit\')"><span class="si">✅</span><span class="st">Remitidos (últimas 4 semanas)</span><span class="bdg ok">'+remRec.length+'</span><span class="caret" id="s-remit-c">▼</span></div><div class="sec-body" id="s-remit-body">';
  var rowsRem=remRec.map(colsRem);
  h+=tH(['Fecha','Cliente','Fertilizante','Cant.','Remito','Depósito'],rowsRem,'#059669');
  h+='</div></div>';

  document.getElementById('cupos-content').innerHTML=h;
}

// ══ RENDER EVOLUCIÓN ══════════════════════════════════════════════════════
function renderEvolucion(frm,cup,kpi){
  var h='';
  var sems=kpi.semanas;

  // TN remitidas separadas sólidos/líquidos
  var solBySem={},liqBySem={},nBySem={};
  cup.forEach(function(r){
    if(!r.fecha||!r.estado.includes('REMITIDO'))return;
    var sem=semISO(r.fecha);
    if(!solBySem[sem]){solBySem[sem]=0;liqBySem[sem]=0;nBySem[sem]=0;}
    solBySem[sem]+=r.tnSol; liqBySem[sem]+=r.ltsLiq; nBySem[sem]++;
  });
  var semsRem=Object.keys(solBySem).sort().slice(-12);

  function sec(id,ico,titulo,bdgCls,n,contenido){
    return '<div class="sec" id="'+id+'"><div class="sec-hdr" onclick="tog(\''+id+'\')">'+
      '<span class="si">'+ico+'</span><span class="st">'+titulo+'</span>'+
      '<span class="bdg '+bdgCls+'">'+n+'</span>'+
      '<span class="caret open" id="'+id+'-c">▼</span></div>'+
      '<div class="sec-body open" id="'+id+'-body">'+contenido+'</div></div>';
  }

  h+=sec('s-ev-cierres','📈','Cierres de negocio por semana','blu',sems.length+' semanas',
    barChart(sems.map(function(s){
      var d=kpi.bySem[s]||{cierres:0};
      return [s.replace('2026-',''),d.cierres];
    }),'#2563eb'));

  h+=sec('s-ev-tn','⚖️','TN cerradas por semana (Form)','ok',sems.length+' semanas',
    barChart(sems.map(function(s){
      var d=kpi.bySem[s]||{tn:0};
      return [s.replace('2026-',''),Math.round(d.tn),0,' tn'];
    }),'#059669'));

  h+=sec('s-ev-cup','📦','Cupos solicitados por semana','amb',sems.length+' semanas',
    barChart(sems.map(function(s){
      var d=kpi.bySem[s]||{cuposSol:0};
      return [s.replace('2026-',''),d.cuposSol];
    }),'#d97706'));

  h+=sec('s-ev-sol','🚚','TN sólidos remitidos por semana','ok',semsRem.length+' semanas',
    barChart(semsRem.map(function(s){
      return [s.replace('2026-',''),Math.round(solBySem[s]||0),0,' tn'];
    }),'#135845'));

  h+=sec('s-ev-liq','💧','Litros líquidos remitidos por semana','blu',semsRem.length+' semanas',
    barChart(semsRem.map(function(s){
      return [s.replace('2026-',''),Math.round((liqBySem[s]||0)/1000),0,'k lts'];
    }),'#0284c7'));

  // Tabla resumen por semana
  var rowsSems=sems.slice().reverse().map(function(s){
    var d=kpi.bySem[s]||{cierres:0,tn:0,cuposSol:0,sinPed:0,reclamos:0};
    var sinP=d.sinPed>0?'HTML:<span style="color:#dc2626;font-weight:700">'+d.sinPed+'</span>':'0';
    return [s,d.cierres,fN(d.tn,0)+' tn',d.cuposSol,sinP,d.reclamos];
  });
  h+=sec('s-ev-tabla','📋','Tabla resumen semanal','neu',sems.length+' semanas',
    tH(['Semana','Cierres','TN','Cupos sol.','Sin N° Ped','Reclamos'],rowsSems,'#135845'));

  document.getElementById('evolucion-content').innerHTML=h;
}

// ══ RENDER COMERCIALES ════════════════════════════════════════════════════
function renderComerciales(frm,cup,kpi){
  var h='';
  var sems4=kpi.semanas.slice(-4);

  // Acumular por comercial en últimas 4 semanas
  var acum={};
  sems4.forEach(function(s){
    var d=kpi.bySem[s];
    if(!d)return;
    Object.keys(d.comerciales).forEach(function(c){
      if(!acum[c])acum[c]={cierres:0,tn:0};
      acum[c].cierres+=(d.comerciales[c]||0);
    });
  });
  // Agregar TN
  frm.forEach(function(r){
    if(!r.accion.includes('CIERRE'))return;
    if(!sems4.includes(semISO(r.fecha)))return;
    var c=r.comercial;
    if(!acum[c])acum[c]={cierres:0,tn:0};
    acum[c].tn+=r.cant;
  });

  var sorted=Object.keys(acum).sort(function(a,b){return acum[b].cierres-acum[a].cierres;});

  h+='<div class="nota blu" style="margin-bottom:12px">Acumulado últimas <strong>4 semanas</strong> ('+sems4[0]+' → '+sems4[sems4.length-1]+')</div>';

  h+='<div class="sec" id="s-com-bar"><div class="sec-hdr" onclick="tog(\'s-com-bar\')"><span class="si">👤</span><span class="st">Cierres por comercial</span><span class="bdg blu">'+sorted.length+' comerciales</span><span class="caret open" id="s-com-bar-c">▼</span></div><div class="sec-body open" id="s-com-bar-body">';
  h+=barChart(sorted.slice(0,12).map(function(c){return [c,acum[c].cierres];}), '#2563eb');
  h+='</div></div>';

  h+='<div class="sec" id="s-com-tn"><div class="sec-hdr" onclick="tog(\'s-com-tn\')"><span class="si">⚖️</span><span class="st">TN por comercial</span><span class="bdg ok">'+sorted.length+' comerciales</span><span class="caret open" id="s-com-tn-c">▼</span></div><div class="sec-body open" id="s-com-tn-body">';
  var sortedTn=Object.keys(acum).sort(function(a,b){return acum[b].tn-acum[a].tn;});
  h+=barChart(sortedTn.slice(0,12).map(function(c){return [c,Math.round(acum[c].tn),0,' tn'];}), '#059669');
  h+='</div></div>';

  // Fertilizantes
  var ferAcum={};
  frm.forEach(function(r){
    if(!r.accion.includes('CIERRE'))return;
    if(!sems4.includes(semISO(r.fecha)))return;
    var f=r.fertil;if(!f)return;
    if(!ferAcum[f])ferAcum[f]=0;
    ferAcum[f]+=r.cant||1;
  });
  var sortedFer=Object.keys(ferAcum).sort(function(a,b){return ferAcum[b]-ferAcum[a];});

  h+='<div class="sec" id="s-ferti"><div class="sec-hdr" onclick="tog(\'s-ferti\')"><span class="si">🌱</span><span class="st">Fertilizantes más negociados (TN)</span><span class="bdg blu">'+sortedFer.length+' productos</span><span class="caret open" id="s-ferti-c">▼</span></div><div class="sec-body open" id="s-ferti-body">';
  h+=barChart(sortedFer.slice(0,15).map(function(f){return [f,Math.round(ferAcum[f]),0,' tn'];}), '#7c3aed');
  h+='</div></div>';

  // Tabla detallada
  h+='<div class="sec" id="s-com-tabla"><div class="sec-hdr" onclick="tog(\'s-com-tabla\')"><span class="si">📋</span><span class="st">Detalle por comercial</span><span class="bdg neu">'+sorted.length+'</span><span class="caret" id="s-com-tabla-c">▼</span></div><div class="sec-body" id="s-com-tabla-body">';
  var rowsCom=sorted.map(function(c){return [c,acum[c].cierres,fN(acum[c].tn,1)+' tn',acum[c].cierres>0?fN(acum[c].tn/acum[c].cierres,1)+' tn/cierre':'—'];});
  h+=tH(['Comercial','Cierres','TN total','Promedio/cierre'],rowsCom,'#2563eb');
  h+='</div></div>';

  document.getElementById('comerciales-content').innerHTML=h;
}

// ══ CARGAR DATOS PRINCIPAL ════════════════════════════════════════════════
function cargarDatos(){
  document.getElementById('loading').style.display='flex';
  document.getElementById('app').style.display='none';

  var step=document.getElementById('load-step');
  step.textContent='Leyendo respuestas del formulario...';

  var URL_FORM  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTAjTHHbqpVVqHG690e65TXYu0AxUiCvRJfg_yeMwnBZN5-91qTPGfJvm1maqRIpFoZY479qFsC1vND/pub?output=csv';
  var URL_CUPOS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqRv9_h_VyFSOMit0tacKGMTJx2XAUHnprwM5zVNPhGcKczbZlrBNXIixTgQVeVip-gS116q7dw7xK/pub?gid=1317122675&single=true&output=csv';
  Promise.all([
    fetchSheet(URL_FORM).catch(function(e){console.warn('Form:',e);return[];}),
    fetchSheet(URL_CUPOS).catch(function(e){console.warn('Cupos:',e);return[];})
  ]).then(function(results){
    step.textContent='Procesando datos...';
    var rowsFrm=results[0], rowsCup=results[1];
    var frm=parseForm(rowsFrm);
    var cup=parseCupos(rowsCup);
    var kpi=calcKPIs(frm,cup);

    window._frm=frm;window._cup=cup;window._kpi=kpi;

    step.textContent='Renderizando...';
    renderResumen(frm,cup,kpi);
    renderNegocios(frm,cup,kpi);
    renderCupos(frm,cup,kpi);
    renderEvolucion(frm,cup,kpi);
    renderComerciales(frm,cup,kpi);

    var now=new Date();
    document.getElementById('hdr-sub').textContent='Actualizado '+now.toLocaleTimeString('es-AR')+' · '+frm.length+' registros Form · '+cup.length+' cupos';

    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  }).catch(function(err){
    step.textContent='Error: '+err.message;
    console.error(err);
  });
}

// Arrancar al cargar
window.addEventListener('load',function(){
  // Auto-refresh cada 5 minutos
  cargarDatos();
  setInterval(cargarDatos, 5*60*1000);
});
</script>
